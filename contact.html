<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Inquiries | African Foods Company</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./javascript/validation.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="container header-flex">
            <div class="logo">
                <h1>African Foods Company Ltd</h1>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="about.html">About Us</a>
                <a href="products.html">Order Products</a>
                <a href="stores.html">Store Locations</a>
                <a href="contact.html">Customer Inquiries</a>
                <a href="sops.html" class="btn-staff">IT SOPs & Policies</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-title">
            <h2>Customer Inquiry & Feedback Form</h2>
            <p>Have a question regarding store stock, bulk pricing, or deliveries? Send us a message.</p>
        </section>

        <form class="inquiry-form">
    <div class="form-group">
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label>Email Address:</label>
        <input type="email" placeholder="name@example.co.za">
    </div>

    <div class="form-group">
        <label>Contact Phone Number:</label>
        <input type="tel" placeholder="e.g. 082 123 4567">
    </div>

    <div class="form-group">
        <label>Inquiry Category:</label>
        <select>
            <option>Product Inquiry & Bulk Pricing</option>
            <option>Store Location & Opening Hours</option>
            <option>Delivery & Order Status</option>
            <option>General Feedback / Complaint</option>
        </select>
    </div>

    <div class="form-group">
        <label>Message / Details:</label>
        <textarea rows="5" placeholder="Type your inquiry details here..."></textarea>
    </div>

    <button type="submit" class="btn btn-gold">Submit Inquiry</button>
</form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 African Foods Company Ltd</p>
        </div>
    </footer>
</body>
</html>
